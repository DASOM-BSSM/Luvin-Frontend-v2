# `release` 브랜치에 푸시되면 production 빌드를 만든다.
#
# - Android: 빌드까지만. 결과물(AAB)은 Play Console / 원스토어에 직접 올린다.
# - iOS: 빌드 후 App Store Connect(TestFlight)까지 자동 제출한다. 심사 제출은 App Store Connect 에서 직접 한다.
#
# 두 플랫폼 빌드는 서로 기다리지 않고 동시에 돈다. 한쪽이 실패해도 다른 쪽은 계속된다.
# 빌드 번호는 eas.json 의 production 프로필(`autoIncrement`)이 올린다.
name: Release build

on:
  push:
    branches:
      - release
    # 빌드 결과물에 영향을 주는 경로가 바뀐 푸시에서만 돈다. EAS 는 paths-ignore 를 지원하지 않아서
    # 제외할 경로가 아니라 포함할 경로를 적는다 — docs/, *.md, .github/ 같은 문서·설정만 바뀌면 건너뛴다.
    # 빌드에 영향을 주는 새 파일이나 폴더가 생기면 여기에 추가할 것(빠뜨리면 그 변경은 빌드되지 않는다).
    paths:
      - 'src/**'
      - 'assets/**'
      - 'app.json'
      - 'eas.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'babel.config.js'
      - 'metro.config.js'
      - 'tailwind.config.js'
      - 'global.css'
      - 'tsconfig.json'

jobs:
  build_android:
    name: Android production build
    type: build
    params:
      platform: android
      profile: production

  build_ios:
    name: iOS production build
    type: build
    params:
      platform: ios
      profile: production

  submit_ios:
    name: iOS submit to App Store Connect
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
